<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Najeef Quran API</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, system-ui, sans-serif;
    background: #F3EEE3;
    color: #5C1A1F;
    opacity: 0;
    animation: fade-in 0.4s ease forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  .boot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .boot-mark {
    font-family: Georgia, serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: #3D0F13;
    opacity: 0.9;
  }

  .boot-spin {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid rgba(92, 26, 31, 0.15);
    border-top-color: #5C1A1F;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; opacity: 1; }
    .boot-spin { animation-duration: 1.4s; }
  }
</style>
</head>
<body>
<div class="boot">
  <div class="boot-mark">﴾ Najeef Quran API ﴿</div>
  <div class="boot-spin" role="status" aria-label="Loading"></div>
</div>

<script type="module">
  import { watchAuthState } from "/auth.js";

  watchAuthState((user) => {
    window.location.href = user ? "/dashboard.html" : "/login.html";
  });
</script>
</body>
</html>
