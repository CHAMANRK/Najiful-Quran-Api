<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Najeef Quran API</title>
<link rel="stylesheet" href="/shared.css">
<script src="/shared.js" defer></script>
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .login-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 32px;
  }

  .login-panel {
    max-width: 400px;
    width: 100%;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--maroon-500);
    font-weight: 600;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Amiri', serif;
    font-size: clamp(30px, 5vw, 38px);
    color: var(--maroon-900);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .login-panel > p {
    font-size: 14.5px;
    color: var(--maroon-600);
    line-height: 1.6;
    margin-bottom: 34px;
  }

  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--cream);
    color: var(--maroon-900);
    border: 1.5px solid var(--maroon-300);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 15px 20px;
    border-radius: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
    margin-bottom: 16px;
  }

  .btn-google:hover { border-color: var(--maroon-700); }
  .btn-google:active { transform: scale(0.98); }
  .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    font-size: 11.5px;
    color: var(--maroon-300);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--maroon-100);
  }

  .email-field label {
    display: block;
    font-size: 12px;
    color: var(--maroon-500);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .email-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 15px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--maroon-300);
    background: var(--cream);
    color: var(--ink);
    margin-bottom: 14px;
  }

  .email-input {
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .email-input:focus {
    outline: none;
    border-color: var(--maroon-700);
    box-shadow: 0 0 0 4px rgba(92,26,31,0.08);
  }

  .email-input::placeholder { color: var(--maroon-300); }

  .btn-email-send {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    border: none;
    cursor: pointer;
    padding: 15px 20px;
    border-radius: 12px;
    background: var(--maroon-700);
    color: var(--cream);
    transition: background 0.15s ease;
  }

  .btn-email-send:hover { background: var(--maroon-600); }
  .btn-email-send:disabled { background: var(--maroon-300); cursor: not-allowed; }

  .login-status {
    font-size: 13px;
    margin-top: 16px;
    min-height: 18px;
    color: var(--maroon-500);
  }
  .login-status.success { color: #2E6B3E; animation: status-in 0.3s ease; }
  .login-status.error { color: #A13A2E; animation: status-shake 0.4s ease; }

  @keyframes status-in {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes status-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .redirect-note {
    text-align: center;
    padding: 40px;
    font-size: 14px;
    color: var(--maroon-600);
  }

  @media (max-width: 640px) {
    .login-wrap { padding: 24px 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/login.html" class="nav-brand">﴾ Najeef Quran API ﴿</a>
  <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/login.html" class="active">Sign in</a>
    <a href="/docs.html">Documentation</a>
    <a href="/about.html">About</a>
  </div>
</nav>
<div class="nav-overlay" id="navOverlay"></div>

<div class="login-wrap">
  <div class="login-panel">
    <div class="eyebrow">Najeef Quran API</div>
    <h1>Sign in to continue.</h1>
    <p>Every key is tied to your account — you'll be able to name it, set an expiration, and revoke it anytime.</p>

    <button class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div class="email-field">
      <label for="emailInput">Email address</label>
      <input type="email" id="emailInput" class="email-input" placeholder="you@example.com" />
      <button class="btn-email-send" id="emailSendBtn">Send sign-in link</button>
    </div>

    <div id="loginStatus" class="login-status"></div>
  </div>
</div>

<script type="module">
  import {
    signInWithGoogle,
    completeGoogleRedirectSignIn,
    sendMagicLink,
    completeMagicLinkSignIn,
    watchAuthState
  } from "/auth.js";

  const googleBtn = document.getElementById("googleBtn");
  const emailInput = document.getElementById("emailInput");
  const emailSendBtn = document.getElementById("emailSendBtn");
  const loginStatus = document.getElementById("loginStatus");

  googleBtn.addEventListener("click", async () => {
    googleBtn.disabled = true;
    loginStatus.textContent = "";
    loginStatus.className = "login-status";
    try {
      await signInWithGoogle();
      // watchAuthState below will redirect once Firebase confirms sign-in
    } catch (err) {
      loginStatus.textContent = "Google sign-in failed: " + err.message;
      loginStatus.className = "login-status error";
      googleBtn.disabled = false;
    }
  });

  emailSendBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!email || !email.includes("@")) {
      loginStatus.textContent = "Enter a valid email first.";
      loginStatus.className = "login-status error";
      return;
    }
    emailSendBtn.disabled = true;
    emailSendBtn.textContent = "Sending…";
    try {
      await sendMagicLink(email);
      loginStatus.textContent = "Link sent — check your inbox and open it on this device.";
      loginStatus.className = "login-status success";
    } catch (err) {
      loginStatus.textContent = "Couldn't send the link: " + err.message;
      loginStatus.className = "login-status error";
      emailSendBtn.disabled = false;
      emailSendBtn.textContent = "Send sign-in link";
    }
  });

  // If this page load came from a magic link, complete it
  completeMagicLinkSignIn().catch((err) => {
    if (err) {
      loginStatus.textContent = "Sign-in link error: " + err.message;
      loginStatus.className = "login-status error";
    }
  });

  // If this page load came back from a Google redirect sign-in, complete it
  completeGoogleRedirectSignIn().catch((err) => {
    loginStatus.textContent = "Google sign-in failed: " + err.message;
    loginStatus.className = "login-status error";
  });

  // Already signed in (or just completed sign-in) → go to dashboard
  watchAuthState((user) => {
    if (user) {
      window.location.href = "/dashboard.html";
    }
  });
</script>

</body>
</html>
